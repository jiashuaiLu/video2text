name: Bug 报告
description: 转写失败、界面异常、崩溃
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请尽量填全，尤其是日志和系统信息——大多数问题靠这两项就能定位。
  - type: input
    id: source
    attributes:
      label: 链接类型
      placeholder: 抖音 / B站 / 本地文件 / 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际结果 vs 你期望的结果
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志
      description: 界面里展开「运行日志」复制，或贴 work/logs/ 下的文件
      render: shell
  - type: input
    id: env
    attributes:
      label: 系统与芯片
      placeholder: macOS 15.6 / Apple M4 Pro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: git commit 或 release 版本号
